<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QR Mochi Burguers</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0b0b0b, #1a1a1a);
    font-family: Arial, sans-serif;
}

.container {
    text-align: center;
    padding: 25px;
    background: #111;
    border-radius: 20px;
    box-shadow: 0 15px 50px rgba(0,0,0,.6);
}

h3 {
    color: white;
}

#qrCanvas {
    width: 340px;
    height: 340px;
    background: white;
    border-radius: 18px;
}

button {
    margin-top: 20px;
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: #ffb300;
    color: #111;
    font-weight: bold;
    font-size: 15px;
}

button:hover {
    background: #ffa000;
}
</style>

</head>

<body>

<div class="container">


<h3>Escanea para entrar a Mochi Burguers</h3>

<canvas id="qrCanvas" width="1360" height="1360"></canvas>

<br>

<button onclick="downloadQR()">
    ⬇ Descargar QR HD
</button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>

const url = "https://mochi-burguers.netlify.app/menuu.html";

const qrSize = 1200;

const tempDiv = document.createElement("div");

new QRCode(tempDiv, {
    text: url,
    width: qrSize,
    height: qrSize,
    colorDark: "#000000",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.H
});

setTimeout(() => {

    const qrImage = tempDiv.querySelector("img");

    if (!qrImage) {
        alert("No se pudo crear el QR.");
        return;
    }

    const canvas = document.getElementById("qrCanvas");
    const ctx = canvas.getContext("2d");

    /* Fondo */
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    /* QR */
    ctx.drawImage(qrImage, 80, 80, qrSize, qrSize);

    /* Logo */
    const logo = new Image();

    logo.onload = function() {

        const logoSize = 300;

        const x = (canvas.width - logoSize) / 2;
        const y = (canvas.height - logoSize) / 2;

        /* Fondo blanco circular */
        ctx.beginPath();
        ctx.arc(
            canvas.width / 2,
            canvas.height / 2,
            logoSize / 2 + 20,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "#ffffff";
        ctx.fill();

        /* Logo */
        ctx.save();

        ctx.beginPath();
        ctx.arc(
            canvas.width / 2,
            canvas.height / 2,
            logoSize / 2,
            0,
            Math.PI * 2
        );

        ctx.clip();

        ctx.drawImage(
            logo,
            x,
            y,
            logoSize,
            logoSize
        );

        ctx.restore();

    };

    logo.onerror = function() {
        alert("No se encontró logo.jpeg. Revisa el nombre exacto del archivo.");
    };

    logo.src = "logo.jpeg";

}, 500);


/* DESCARGAR */
function downloadQR() {

    const canvas = document.getElementById("qrCanvas");

    const link = document.createElement("a");

    link.download = "QR-Mochi-Burguers-HD.png";

    link.href = canvas.toDataURL("image/png");

    link.click();
}

</script>

</body>
</html>
