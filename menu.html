<style>
:root{
  --orange:#ff7a00;
  --gold:#ffb703;
  --cream:#fff7e8;
  --black:#08090b;

  --muted:#a7a7ad;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'DM Sans',sans-serif}
html{scroll-behavior:smooth}
body{
  min-height:100vh;
  color:#fff;
  background:
    linear-gradient(180deg,rgba(4,5,7,.58),rgba(4,5,7,.94) 72%),
    url("100.jpeg") center/cover fixed no-repeat;
  padding-bottom:92px;
  overflow-x:hidden;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(circle at 50% 0,rgba(255,122,0,.14),transparent 35%);
}
header{
  position:sticky;top:0;z-index:1000;
  display:flex;justify-content:center;align-items:center;
  min-height:70px;padding:14px 20px;
  background:rgba(8,9,11,.72);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}
.logo{
  font-size:clamp(21px,4vw,30px);font-weight:800;letter-spacing:-.8px;
  color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.4)
}
.logo::first-letter{filter:drop-shadow(0 3px 8px rgba(255,122,0,.35))}
.cart{
  position:fixed;top:82px;right:18px;z-index:990;
  display:flex;align-items:center;gap:7px;
  padding:10px 14px;border:1px solid rgba(255,183,3,.28);

  color:var(--gold);font-weight:800;box-shadow:0 12px 30px rgba(0,0,0,.3);
  backdrop-filter:blur(12px)
}
.title{text-align:center;padding:30px 15px 10px}
.title h1{font-size:clamp(26px,4vw,40px);font-weight:800;letter-spacing:-1px}
.title span{color:var(--orange)}
.menu{width:min(1180px,92%);margin:auto;padding:20px 0 35px}
.hero-title{
  position:relative;width:min(1180px,92%);height:270px;margin:20px auto 8px;
  overflow:hidden;border:1px solid var(--line);border-radius:30px;
  background:rgba(255,255,255,.045);
  box-shadow:0 25px 70px rgba(0,0,0,.38)
}
.hero-title:after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(0,0,0,.68),rgba(0,0,0,.16),rgba(0,0,0,.6));
}
.hero-title img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.08) contrast(1.04)}
.hero-text{position:absolute;z-index:2;inset:0;display:flex;align-items:center;justify-content:center;text-align:center}
.hero-text h1{
  font-size:clamp(34px,6vw,66px);line-height:1.05;font-weight:800;
  text-shadow:0 8px 35px rgba(0,0,0,.7)
}
.hero-text span{color:var(--orange)}
.cards{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px
}
.card{
  position:relative;display:flex;flex-direction:column;overflow:hidden;
  min-width:0;border:1px solid var(--line);border-radius:24px;
  background:linear-gradient(180deg,rgba(24,25,29,.88),rgba(10,11,13,.92));
  box-shadow:0 18px 45px rgba(0,0,0,.28);
  transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease
}
.card:hover{transform:translateY(-7px);border-color:rgba(255,122,0,.34);box-shadow:0 25px 55px rgba(0,0,0,.4)}
.card img{
  width:100%;height:210px;object-fit:cover;display:block;cursor:pointer;
  transition:transform .35s ease;filter:saturate(1.08)
}
.card:hover img{transform:scale(1.045)}
.card-body{padding:17px 17px 14px;flex:1;min-width:0}
.card h3{font-size:18px;line-height:1.25;font-weight:800;color:#fff}
.card p{
  margin:7px 0;color:var(--muted);font-size:12px;line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden
}
.price{color:var(--gold);font-size:18px;font-weight:800;margin-top:10px}
.add-btn{
  width:calc(100% - 30px);margin:0 15px 15px;padding:12px 15px;
  border:0;border-radius:14px;background:linear-gradient(135deg,var(--orange),var(--gold));
  color:#090909;font-weight:800;font-size:14px;cursor:pointer;
  box-shadow:0 10px 22px rgba(255,122,0,.18);transition:.2s
}
.add-btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
.bottom-nav{
  position:fixed;left:50%;bottom:12px;transform:translateX(-50%);
  z-index:2000;width:min(560px,calc(100% - 24px));height:68px;
  display:flex;align-items:center;justify-content:space-around;
  padding:7px 8px;border:1px solid rgba(255,255,255,.1);
  border-radius:22px;background:rgba(8,9,11,.9);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 18px 50px rgba(0,0,0,.5)
}
.nav-item{
  position:relative;min-width:72px;height:54px;padding:5px 8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border:0;background:transparent;color:#999;cursor:pointer;border-radius:15px;
  font-size:10px;font-weight:600;transition:.2s
}
.nav-item i{font-size:19px}.nav-item.active{color:var(--orange);background:rgba(255,122,0,.09)}
.nav-item:active{transform:scale(.94)}
.icon-wrapper{position:relative}.cart-badge{
  position:absolute;top:-7px;right:-12px;min-width:18px;height:18px;
  display:grid;place-items:center;padding:0 4px;border-radius:50px;
  background:var(--orange);color:#111;font-size:9px;font-weight:800
}
.lightbox{
  position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;
  padding:20px;background:rgba(0,0,0,.94);backdrop-filter:blur(10px)
}
.lightbox img{max-width:94vw;max-height:88vh;border-radius:18px;box-shadow:0 25px 70px #000}
@media(max-width:1000px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}

img:"107.jpeg",
extras:[

]
},


{
nombre:"Chiken BBQ",
precio:260,
desc:"                        Pollo BBQ, coleslaw y pan casero, con un irresistible Jack pepper cheese, PURA LOCURA",
img:"109.jpg",
extras:[
]
},

];


/* ================= BEBIDAS ================= */
const bebidas = [
{nombre:"Coca cola",precio:30,desc:"Coca cola de lata",img:"104.jpg"},
{nombre:"Fanta uva",precio:30,desc:"Fanta uva de lata",img:"110.webp"},
{nombre:"Canada Dry",precio:30,desc:"Canada Dry",img:"106.jpg"},
{nombre:"Agua",precio:30,desc:"Fuente Pura",img:"111.jpg"},

];

/* ================= CARRITO ================= */
let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

/* ================= ESTADO ================= */
let productoSeleccionado = null;
let extrasSeleccionados = {};

/* ================= RENDER MENÚ ================= */
function render(){
let html = "";

productos.forEach((p,i)=>{
let extrasPreview = "";

if(p.extras?.length){
extrasPreview = `
<div style="font-size:12px;color:#aaa;margin-top:4px;">
Agregar Extras: ${p.extras.map(e=>e.nombre).join(", ")}
</div>`;
}

html += `
<div class="card">

<img src="${p.img}" onclick="abrirLightbox('${p.img}')">

<div class="card-body">
<h3>${p.nombre}</h3>
${extrasPreview}
<p>${p.desc}</p>
<div class="price">C$${p.precio}</div>
</div>

<button class="add-btn" onclick="abrirExtras(${i})">
${window.innerWidth<=768?"+":"Agregar"}
</button>

</div>`;
});

document.getElementById("menu").innerHTML = html;
}

/* ================= BANDEJAS ================= */
function renderBandejas(){
let html = "";

bandejas.forEach((p,i)=>{
html += `
<div class="card">

<img src="${p.img}" onclick="abrirLightbox('${p.img}')">

<div class="card-body">
<h3>${p.nombre}</h3>
<p>${p.desc}</p>
<div class="price">C$${p.precio}</div>
</div>

<button class="add-btn" onclick="agregarBandeja(${i})">
${window.innerWidth<=768?"+":"Agregar"}
</button>

</div>`;
});

document.getElementById("bandejas").innerHTML = html;
}

/* ================= BEBIDAS ================= */
function renderBebidas(){
let html = "";

bebidas.forEach((p,i)=>{
html += `
<div class="card">

<img src="${p.img}" onclick="abrirLightbox('${p.img}')">

<div class="card-body">
<h3>${p.nombre}</h3>
<p>${p.desc}</p>
<div class="price">C$${p.precio}</div>
</div>

<button class="add-btn" onclick="agregarBebida(${i})">
${window.innerWidth<=768?"+":"Agregar"}
</button>

</div>`;
});

document.getElementById("bebidas").innerHTML = html;
}

function agregarBebida(i){
let p = bebidas[i];

let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

let index = carrito.findIndex(x=>x.nombre===p.nombre);

if(index!==-1){
carrito[index].qty++;
}else{
carrito.push({
nombre:p.nombre,
precio:p.precio,
desc:p.desc,
img:p.img,
qty:1,
extras:[]
});
}

localStorage.setItem("carrito",JSON.stringify(carrito));

update();
mostrarToast("✔ Bebida agregada");
}

/* ================= EXTRAS ================= */
function abrirExtras(i){
productoSeleccionado = productos[i];
extrasSeleccionados = {};

let extrasHTML = "";

if(productoSeleccionado.extras?.length){
productoSeleccionado.extras.forEach((e,idx)=>{
extrasHTML += `
<div style="display:flex;justify-content:space-between;align-items:center;margin:10px 0;border-bottom:1px solid #222;padding:6px 0;">

<label style="display:flex;align-items:center;gap:8px;">
<input type="checkbox" onchange="toggleExtra(${idx})">
<span>${e.nombre}</span>
</label>

<span style="color:#ff9800;font-weight:bold">+C$${e.precio}</span>

</div>`;
});
}else{
extrasHTML = `<p style="color:#aaa">Sin extras</p>`;
}

let box = document.createElement("div");
box.id="extrasBox";
box.style = `position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:9999;`;

box.innerHTML = `
<div style="background:#111;padding:20px;border-radius:15px;width:320px;color:#fff">

<h3>${productoSeleccionado.nombre}</h3>

${extrasHTML}

<button onclick="confirmarExtra()" style="width:100%;padding:12px;background:#ff9800;border:none;font-weight:800;border-radius:10px;">Agregar</button>

<button onclick="cerrarExtras()" style="width:100%;margin-top:10px;padding:10px;background:#333;border:none;color:#fff;border-radius:10px;">Cerrar</button>

</div>`;

document.body.appendChild(box);
}

/* ================= CARRITO ================= */
function confirmarExtra(){

let extraTotal = 0;
let extrasFinal = [];

for(let k in extrasSeleccionados){
extraTotal += extrasSeleccionados[k];
extrasFinal.push({nombre:k,precio:extrasSeleccionados[k]});
}

let total = productoSeleccionado.precio + extraTotal;

let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

carrito.push({
nombre:productoSeleccionado.nombre,
precio:total,
desc:productoSeleccionado.desc,
img:productoSeleccionado.img,
qty:1,
extras:extrasFinal
});

localStorage.setItem("carrito",JSON.stringify(carrito));

cerrarExtras();
update();
mostrarToast("✔ Agregado");
}

function cerrarExtras(){
let b=document.getElementById("extrasBox");
if(b) b.remove();
}

function toggleExtra(i){
let e = productoSeleccionado.extras[i];

if(extrasSeleccionados[e.nombre]){
delete extrasSeleccionados[e.nombre];
}else{
extrasSeleccionados[e.nombre]=e.precio;
}
}

/* ================= BANDEJAS ================= */
function agregarBandeja(i){
let p = bandejas[i];

let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

let index = carrito.findIndex(x=>x.nombre===p.nombre);

if(index!==-1){
carrito[index].qty++;
}else{
carrito.push({
nombre:p.nombre,
precio:p.precio,
desc:p.desc,
img:p.img,
qty:1,
extras:[]
});
}

localStorage.setItem("carrito",JSON.stringify(carrito));

update();
mostrarToast("✔ Bandeja agregada");
}

/* ================= UPDATE ================= */
function update(){
let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

let total=0;
carrito.forEach(p=>total+=p.qty);

document.getElementById("count").innerText=total;

let nav=document.getElementById("cartCount");
if(nav) nav.innerText=total;
}

/* ================= TOAST ================= */
function mostrarToast(msg){
let t=document.createElement("div");
t.innerText=msg;
t.style=`position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:linear-gradient(135deg,#ff7a00,#ffb703);color:#08090b;padding:11px 18px;border-radius:999px;font-weight:800;z-index:9999;box-shadow:0 12px 30px rgba(0,0,0,.35);white-space:nowrap;`;
document.body.appendChild(t);
setTimeout(()=>t.remove(),1500);
}

/* ================= LIGHTBOX ================= */
function abrirLightbox(img){
document.getElementById("lightboxImg").src=img;
document.getElementById("lightbox").style.display="flex";
}

function cerrarLightbox(){
document.getElementById("lightbox").style.display="none";
document.getElementById("lightboxImg").src="";
}

/* ================= INIT ================= */
render();
renderBebidas();
update();
</script>
</body>
</html>
